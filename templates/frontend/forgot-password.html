<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password | EgoBellPay</title>
  <meta name="description" content="Reset your EgoBellPay password.">
  <meta name="theme-color" content="#0E1F18">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/pages.css" rel="stylesheet">

  <script>document.documentElement.className += ' js';</script>
</head>
<body>
  <!-- SVG icon sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" class="d-none" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15L6 17z"/><path d="M10 21.5h4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-5 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  </svg>


  <main class="auth">
    <aside class="auth__aside">
      <div class="orbit orbit--1" aria-hidden="true"><span class="orbit__dot"></span></div>
      <div class="orbit orbit--2" aria-hidden="true"><span class="orbit__dot"></span></div>
      <a class="brand" href="index.html">
        <span class="brand__mark"><svg class="icon"><use href="#i-bell"/></svg></span>
        <span class="brand__name">EgoBellPay</span>
      </a>
      <div class="auth__pitch">
        <h2 class="auth__title">Locked out? It happens.</h2>
        <p class="auth__text">Tell us your email and we will send a link to set a new password.</p>
      </div>
      <p class="auth__foot">The link works once and expires soon after we send it.</p>
    </aside>

    <div class="auth__main">
      <div class="auth__card">
        <div>
          <h1 class="auth__heading">Reset your password</h1>
          <p class="auth__sub">Enter the email you signed up with.</p>
        </div>

        <form data-form="forgot" data-endpoint="/auth/forgot-password" data-success="If that email has an account, a reset link is on its way." novalidate>
              <div class="field">
                <label for="forgotEmail">Email address</label>
                <input class="form-control" type="email" id="forgotEmail" name="email" required autocomplete="email" data-rule="email" data-msg="Enter your email address.">
                <div class="invalid-feedback" role="alert"></div>
              </div>
              <button type="submit" class="btn btn-brand btn-lg w-100"><span class="spinner" aria-hidden="true"></span>Send reset link</button>
              <div class="form-status" role="status" aria-live="polite"></div>
        </form>
        <p><a class="text-link" href="login.html">Back to sign in</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
